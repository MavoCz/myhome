<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Násobilka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Same look as Sčítání pod sebou: a squared exercise book on a school desk, number keys on the right. */
:root {
  --desk: #e4eaf3;
  --paper: #fdfdfb;
  --grid: #d3dfee;
  --ink: #1d2640;
  --muted: #5b6985;
  --a: #2a5bd7;
  --a-deep: #1c43a6;
  --on-a: #ffffff;
  --b: #0b8a73;
  --carry: #e06800;
  --hi: rgba(255, 207, 51, .40);
  --focus: #2a5bd7;
  --focus-soft: rgba(42, 91, 215, .18);
  --ok: #16914a;
  --bad: #d23c3c;
  --key: #ffffff;
  --key-edge: #c5d1e4;
  --bubble: #ffffff;
  --star: #f2b100;
  --shadow: 0 1px 0 rgba(29, 38, 64, .05), 0 10px 28px -14px rgba(29, 38, 64, .30);
  --font-ui: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Chalkboard SE", "Comic Sans MS", cursive;
  --cell: clamp(56px, min(10vw, 11vh), 96px);
  --half: calc(var(--cell) / 2);
  --u: clamp(7px, 1.2vmin, 12px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0e1613; --paper: #1b2924; --grid: rgba(220, 238, 228, .08); --ink: #eef4ef; --muted: #9fb5aa;
    --a: #8db4ff; --a-deep: #5b84d4; --on-a: #0e1613; --b: #5fdcc0; --carry: #ffab5a;
    --hi: rgba(255, 220, 90, .15); --focus: #8db4ff; --focus-soft: rgba(141, 180, 255, .2);
    --ok: #5fd68c; --bad: #ff7d7d; --key: #23342d; --key-edge: #3a4f46; --bubble: #24362f;
    --shadow: 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0e1613; --paper: #1b2924; --grid: rgba(220, 238, 228, .08); --ink: #eef4ef; --muted: #9fb5aa;
  --a: #8db4ff; --a-deep: #5b84d4; --on-a: #0e1613; --b: #5fdcc0; --carry: #ffab5a;
  --hi: rgba(255, 220, 90, .15); --focus: #8db4ff; --focus-soft: rgba(141, 180, 255, .2);
  --ok: #5fd68c; --bad: #ff7d7d; --key: #23342d; --key-edge: #3a4f46; --bubble: #24362f;
  --shadow: 0 10px 28px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin-right: auto; }
h1 { margin: 0; font-size: clamp(1.45rem, 3.2vw, 2rem); font-weight: 800; line-height: 1.1; text-wrap: balance; }
.grade { font-weight: 600; color: var(--muted); font-size: .98rem; white-space: nowrap; }
.modes {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--key); border: 2px solid var(--key-edge); border-radius: 999px;
}
.modes button {
  border: 0; background: transparent; border-radius: 999px;
  font-size: 1rem; font-weight: 700; color: var(--muted);
  min-height: 42px; padding: 0 14px;
}
.modes button[aria-checked="true"] { background: var(--a); color: var(--on-a); }
.tools { display: flex; align-items: center; gap: 10px; }
.score {
  display: flex; align-items: center; gap: 6px;
  font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums;
  padding: 0 6px;
}
.score svg { width: 30px; height: 30px; fill: var(--star); display: block; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 999px;
  background: var(--key); border: 2px solid var(--key-edge);
  font-weight: 700; font-size: 1rem; color: var(--muted);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .off { display: none; }
.icon-btn[aria-pressed="false"] .on { display: none; }
.icon-btn[aria-pressed="false"] .off { display: inline; }

/* Stage */
.stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.paper {
  position: relative;
  min-width: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--half) var(--half);
  border-radius: 6px 18px 18px 6px;
  box-shadow: var(--shadow);
  padding: 20px 16px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
}

.bubble {
  position: relative;
  max-width: min(34ch, 100%);
  min-height: calc(2 * 1.35em + 24px);
  display: flex; align-items: center; justify-content: center;
  padding: 10px 18px;
  background: var(--bubble);
  border: 2px solid var(--key-edge);
  border-radius: 18px;
  box-shadow: var(--shadow);
  font-size: clamp(1.1rem, 2.3vw, 1.4rem);
  font-weight: 600; line-height: 1.35; text-align: center; text-wrap: balance;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -9px;
  width: 15px; height: 15px; background: var(--bubble);
  border-right: 2px solid var(--key-edge); border-bottom: 2px solid var(--key-edge);
  transform: translateX(-50%) rotate(45deg);
}
.bubble.ok, .bubble.ok::after { border-color: var(--ok); }
.bubble.hint, .bubble.hint::after { border-color: var(--carry); }
.bubble .a { color: var(--a); font-weight: 800; }
.bubble .b { color: var(--b); font-weight: 800; }
.bubble .c { color: var(--carry); font-weight: 800; }
.bubble b { font-weight: 800; }

/* The written sum: columns sign | S | D | J, rows label | carry | a | b | result */
.sheet {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, var(--cell));
  grid-template-rows: var(--half) var(--half) var(--cell) var(--cell) var(--cell);
  font-family: var(--font-hand);
}
.sheet > * { position: relative; z-index: 1; }
.hl {
  grid-row: 2 / 6; grid-column: 4;
  margin: 0 3px; border-radius: 10px;
  background: var(--hi);
  transition: transform .45s cubic-bezier(.3, .7, .2, 1), opacity .3s;
  pointer-events: none;
}
.sheet > .hl { z-index: 0; }
.lbl {
  grid-row: 1; display: grid; place-items: center;
  font: 700 calc(var(--half) * .5) var(--font-ui);
  color: var(--muted); letter-spacing: .06em;
  transition: opacity .3s;
}
.lbl.ghost { opacity: 0; }
.carry {
  grid-row: 2; display: grid; place-items: center;
  font-size: calc(var(--half) * .95); line-height: 1; color: var(--carry);
}
.d { display: grid; place-items: center; font-size: calc(var(--cell) * .8); line-height: 1; }
.d.a { grid-row: 3; color: var(--a); }
.d.b { grid-row: 4; color: var(--b); }
.d.sign { grid-row: 4; grid-column: 1; color: var(--ink); }
.rule {
  grid-row: 5; grid-column: 1 / -1; align-self: start;
  height: 3px; margin-top: -1.5px; border-radius: 2px; background: var(--ink);
}
.res {
  grid-row: 5; display: grid; place-items: center;
  margin: 7px 5px 3px; border-radius: 10px;
  font-size: calc(var(--cell) * .8); line-height: 1; color: var(--ink);
}
.res.active { box-shadow: inset 0 0 0 3px var(--focus); animation: pulse 1.4s ease-in-out infinite; }
.res.wrong { color: var(--bad); }

.actions, .panel-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 0 22px; border-radius: 16px;
  font-size: 1.15rem; font-weight: 700;
  background: var(--key); color: var(--ink);
  border: 2px solid var(--key-edge); box-shadow: 0 3px 0 var(--key-edge);
}
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-edge); }
.btn.primary { background: var(--a); color: var(--on-a); border-color: var(--a-deep); box-shadow: 0 3px 0 var(--a-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--a-deep); }
.btn.glow { animation: nudge 1.3s ease-in-out infinite; }

/* Side panels */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.panel h2 {
  margin: 0 0 12px; font-size: .9rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em;
}
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  height: clamp(62px, 10.5vh, 90px);
  border-radius: 18px;
  font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--key); color: var(--ink);
  border: 2px solid var(--key-edge); box-shadow: 0 4px 0 var(--key-edge);
  transition: opacity .2s;
}
.key.zero { grid-column: 1 / -1; }
.key:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-edge); }
.key:disabled { opacity: .4; cursor: default; }
.tip { margin: 14px 2px 0; color: var(--muted); font-size: 1rem; line-height: 1.4; }
.tip strong { color: var(--ink); }

/* Flying digit and celebration stars */
.flyer { position: fixed; z-index: 50; pointer-events: none; display: grid; place-items: center; font-family: var(--font-hand); line-height: 1; color: var(--carry); }
.spark { position: fixed; z-index: 60; width: 18px; height: 18px; pointer-events: none; }
.spark.big { width: 40px; height: 40px; }
.spark svg { width: 100%; height: 100%; fill: var(--star); display: block; }

@keyframes pulse { 50% { box-shadow: inset 0 0 0 3px var(--focus), 0 0 0 7px var(--focus-soft); } }
@keyframes nudge { 50% { transform: translateY(-3px); box-shadow: 0 6px 0 var(--a-deep), 0 0 0 6px var(--focus-soft); } }
@media (prefers-reduced-motion: reduce) {
  .res.active, .btn.glow { animation: none; }
  .hl { transition: none; }
}

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 16px; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--key-edge); background: transparent; }
.dot.ok { background: var(--ok); border-color: var(--ok); } .dot.bad { background: var(--bad); border-color: var(--bad); }
.dot.now { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-soft); }
.eqrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 calc(var(--cell) * .12); font-family: var(--font-hand); min-height: calc(var(--cell) * 1.3); }
.eqrow .d { font-size: calc(var(--cell) * .85); width: auto; min-width: calc(var(--cell) * .5); }
.eqrow .d.a { color: var(--a); } .eqrow .d.b { color: var(--b); } .eqrow .d.sign { color: var(--ink); }
.eqrow .res { width: var(--cell); height: var(--cell); margin: 0; box-shadow: inset 0 0 0 3px var(--key-edge); background: var(--paper); }
.eqrow .res.active { box-shadow: inset 0 0 0 3px var(--focus); }
.eqrow .res.ok { color: var(--ok); box-shadow: inset 0 0 0 3px var(--ok); }
.key.small { height: 52px; font-size: 1.4rem; }
.picks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.key[aria-pressed="true"] { background: var(--a); color: var(--on-a); border-color: var(--a-deep); box-shadow: 0 4px 0 var(--a-deep); }
.dotgrid { display: grid; gap: 6px; justify-content: center; margin: 4px 0 8px; }
.dotgrid i { width: 16px; height: 16px; border-radius: 50%; background: var(--pc); display: block; }
.pa { --pc: var(--a); } .pb { --pc: var(--b); }
.dotcap { text-align: center; color: var(--muted); font-size: 1.05rem; font-weight: 600; }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; }
.result .big { font-family: var(--font-hand); font-size: 4rem; line-height: 1; }
.result .stars { display: flex; gap: 8px; } .result .stars svg { width: 44px; height: 44px; fill: var(--key-edge); }
.result .stars svg.on { fill: var(--star); }
.result h3 { margin: 6px 0 0; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.miss { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.miss span { background: var(--bubble); border: 2px solid var(--key-edge); border-radius: 12px; padding: 4px 12px; font-family: var(--font-hand); font-size: 1.5rem; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Násobilka</h1>
      <span class="grade">násobení a dělení do 100</span>
    </div>
    <div class="modes" role="radiogroup" aria-label="Druh příkladů">
      <button type="button" role="radio" data-mode="mul" id="mode-mul">Násobení</button>
      <button type="button" role="radio" data-mode="div" id="mode-div">Dělení</button>
      <button type="button" role="radio" data-mode="mix" id="mode-mix">Obojí</button>
    </div>
    <div class="tools">
      <button type="button" class="icon-btn" id="voiceBtn" aria-pressed="true">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        <span>Hlas</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="paper" id="paper" aria-label="Sešit">
      <div class="dots" id="dots" aria-label="Postup kolem"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <div class="sheet-eq" id="prompt" style="width:100%"></div>
      <div class="actions" id="actions">
        <button type="button" class="btn" id="delBtn">Smazat</button>
        <button type="button" class="btn" id="hintBtn">Ukaž tečky</button>
        <button type="button" class="btn primary" id="nextBtn" hidden>Další příklad</button>
      </div>
    </section>

    <aside class="side">
      <section class="panel" id="keysPanel">
        <h2>Napiš číslici</h2>
        <div class="keypad" id="keypad"></div>
        <p class="tip">Násobilku si můžeš spočítat v <strong>tečkách</strong>: řádky krát tečky v řádku.</p>
      </section>
      <section class="panel" id="dotsPanel" hidden>
        <h2>Tečky</h2>
        <div id="dotsBox"></div>
        <div class="dotcap" id="dotCap"></div>
      </section>
      <section class="panel">
        <h2>Která násobilka</h2>
        <div class="picks" id="tablePick"></div>
      </section>
    </aside>
  </main>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = ms => RM ? Math.min(ms, 120) : ms;
  const W = ms => RM ? Math.round(ms * .7) : ms;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const TABLES = [2, 3, 4, 5, 6, 7, 8, 9, 10];
  const ROUND = 10;

  function el(tag, cls, parent, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- saved settings ----------
  const KEY = 'nasobilka';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
  const saved = load();
  const state = {
    stars: saved.stars | 0,
    voice: saved.voice === true,
    tables: Array.isArray(saved.tables) && saved.tables.some(n => TABLES.includes(n))
      ? saved.tables.filter(n => TABLES.includes(n)) : [2, 3, 4, 5],
    mode: ['mul', 'div', 'mix'].includes(saved.mode) ? saved.mode : 'mul',
    round: [], idx: 0, results: [], busy: false, answered: false, gen: 0, retry: false, typed: '',
  };
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ stars: state.stars, voice: state.voice, tables: state.tables, mode: state.mode })); } catch {}
  }
  // ---------- voice ----------
  let interacted = false, csVoice = null;
  const canSpeak = 'speechSynthesis' in window;
  // iPad lists several Czech voices: the Eloquence ones (Eddy, Flo, Reed…) sound robotic, while a downloaded
  // Zuzana (Enhanced / Premium) sounds natural. Take the best one installed, not the first one listed.
  const ROBOTIC = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i;
  function voiceScore(v) {
    const id = `${v.name} ${v.voiceURI}`;
    if (ROBOTIC.test(id)) return 0;
    if (/premium/i.test(id)) return 5;
    if (/enhanced|natural|neural/i.test(id)) return 4;
    if (/google/i.test(id)) return 3;
    if (/zuzana/i.test(id)) return 2;
    return 1;
  }
  function pickVoice() {
    try {
      const czech = speechSynthesis.getVoices().filter(v => /^cs([-_]|$)/i.test(v.lang));
      csVoice = czech.sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
    } catch {}
  }
  if (canSpeak) { try { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch {} }
  const markInteracted = () => { interacted = true; };
  document.addEventListener('pointerdown', markInteracted, { capture: true });
  document.addEventListener('keydown', markInteracted, { capture: true });
  function stopSpeech() { if (canSpeak) { try { speechSynthesis.cancel(); } catch {} } }
  function speak(text, force) {
    return new Promise(done => {
      if (!canSpeak || (!state.voice && !force) || !interacted || !speechSynthesis.getVoices().length) return done();
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'cs-CZ';
        if (csVoice) u.voice = csVoice;
        u.rate = .9;
        u.onend = done;
        u.onerror = done;
        // some devices never report the end of speech; do not keep the child waiting
        setTimeout(done, Math.min(8000, 1200 + text.length * 70));
        speechSynthesis.speak(u);
      } catch { done(); }
    });
  }
  const plain = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };




  // ---------- practice ----------
  const prompt = $('#prompt'), bubble = $('#bubble'), dots = $('#dots'), keypad = $('#keypad');
  const nextBtn = $('#nextBtn'), hintBtn = $('#hintBtn'), delBtn = $('#delBtn'), actions = $('#actions');
  const dotsPanel = $('#dotsPanel'), dotsBox = $('#dotsBox'), dotCap = $('#dotCap');

  // a problem is a x b = c; dividing asks c : a = b (so the answer is always the other factor)
  function makeProblems() {
    const pool = [];
    state.tables.forEach(a => { for (let b = 1; b <= 10; b++) {
      if (state.mode !== 'div') pool.push({ a, b, c: a * b, op: 'x', ans: a * b });
      if (state.mode !== 'mul') pool.push({ a, b, c: a * b, op: ':', ans: b });
    } });
    // 3 x 4 and 4 x 3 are the same problem for one round
    const seen = new Set(), out = [];
    shuffle(pool).forEach(p => {
      const key = p.op === 'x' ? `x${Math.min(p.a, p.b)}${Math.max(p.a, p.b)}` : `:${p.c}:${p.a}`;
      if (!seen.has(key)) { seen.add(key); out.push(p); }
    });
    return out.slice(0, ROUND);
  }
  const left = p => p.op === 'x' ? p.a : p.c;
  const right = p => p.op === 'x' ? p.b : p.a;
  const textOf = p => p.op === 'x' ? `${p.a} × ${p.b}` : `${p.c} : ${p.a}`;
  const spokenOf = p => p.op === 'x' ? `${p.a} krát ${p.b}` : `${p.c} děleno ${p.a}`;
  // Czech plural after a number: 1 tečku, 2–4 tečky, 5+ teček
  const dotWord = n => n === 1 ? 'tečku' : n <= 4 ? 'tečky' : 'teček';

  function say(html, cls) {
    bubble.className = 'bubble' + (cls ? ' ' + cls : '');
    // one child, because the bubble is a flex box and would lay out every <b> and <span> as its own item
    bubble.innerHTML = `<div>${html}</div>`;
  }
  const setKeys = on => keypad.querySelectorAll('button').forEach(b => { b.disabled = !on; });

  function startRound(items) {
    state.gen++;
    stopSpeech();
    state.round = items ? shuffle(items) : makeProblems();
    state.idx = 0;
    state.results = [];
    state.retry = !!items;
    keypad.parentElement.hidden = false;
    actions.hidden = false;
    renderDots();
    showItem();
  }

  function renderDots() {
    dots.innerHTML = '';
    state.round.forEach((_, i) => {
      const d = el('span', 'dot', dots);
      if (i < state.results.length) d.classList.add(state.results[i] ? 'ok' : 'bad');
      if (i === state.idx && i >= state.results.length) d.classList.add('now');
    });
  }

  const cells = () => [...prompt.querySelectorAll('.res')];
  function showTyped() {
    const need = cells();
    need.forEach((c, i) => { c.textContent = state.typed[i] || ''; c.classList.toggle('active', i === state.typed.length); });
  }

  function showItem() {
    const p = state.round[state.idx];
    state.answered = false;
    state.busy = false;
    state.typed = '';
    const n = String(p.ans).length;
    prompt.innerHTML = `<div class="eqrow"><span class="d a">${left(p)}</span><span class="d sign">${p.op === 'x' ? '×' : ':'}</span><span class="d b">${right(p)}</span><span class="d sign">=</span>${'<span class="res"></span>'.repeat(n)}</div>`;
    dotsPanel.hidden = true;
    say(`Kolik je <span class="a">${left(p)}</span> ${p.op === 'x' ? '×' : ':'} <span class="b">${right(p)}</span>?`);
    nextBtn.hidden = true;
    nextBtn.classList.remove('glow');
    hintBtn.hidden = false;
    hintBtn.disabled = false;
    delBtn.hidden = false;
    setKeys(true);
    showTyped();
    renderDots();
    speak(spokenOf(p));
  }

  function onDigit(d) {
    if (state.busy || state.answered) return;
    const n = cells().length;
    if (state.typed.length >= n) return;
    state.typed += d;
    showTyped();
    if (state.typed.length === n) submit();
  }
  function backspace() {
    if (state.busy || state.answered) return;
    state.typed = state.typed.slice(0, -1);
    showTyped();
  }

  // rows of dots: a rows with b dots each (dividing shows the same picture)
  function showDots(p) {
    const rows = p.a, per = p.op === 'x' ? p.b : p.ans;
    dotsBox.innerHTML = '';
    const grid = el('div', 'dotgrid', dotsBox);
    grid.style.gridTemplateColumns = `repeat(${per}, 16px)`;
    for (let r = 0; r < rows; r++) for (let c = 0; c < per; c++) el('i', r % 2 ? 'pb' : 'pa', grid);
    dotsPanel.hidden = false;
    dotCap.textContent = p.op === 'x'
      ? `${rows} řádků po ${per} tečkách`
      : `${p.c} teček do ${rows} řádků, v každém ${per}`;
    grid.animate([{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: T(300) });
  }

  async function submit() {
    if (state.busy || state.answered || !state.round.length) return;
    const p = state.round[state.idx], g = state.gen;
    state.busy = true;
    state.answered = true;
    setKeys(false);
    hintBtn.disabled = true;
    delBtn.hidden = true;
    const cs = cells();
    cs.forEach(c => c.classList.remove('active'));
    if (Number(state.typed) === p.ans) {
      cs.forEach(c => c.classList.add('ok'));
      state.results.push(true);
      renderDots();
      say(`Správně! <b>${textOf(p)} = ${p.ans}</b>`, 'ok');
      await Promise.all([speak(String(p.ans)), sleep(W(1500))]);
      if (g !== state.gen) return;
      advance();
      return;
    }
    cs.forEach(c => c.classList.add('wrong'));
    await Promise.all(cs.map(c => c.animate([
      { transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' },
      { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' },
    ], { duration: T(380) }).finished));
    if (g !== state.gen) return;
    cs.forEach((c, i) => { c.classList.remove('wrong'); c.classList.add('ok'); c.textContent = String(p.ans)[i]; });
    state.results.push(false);
    renderDots();
    showDots(p);
    say(`Správně je <b>${p.ans}</b>. Podívej se na tečky: ${p.op === 'x'
      ? `<span class="a">${p.a}</span> řádků po <span class="b">${p.b}</span> ${dotWord(p.b)} je <b>${p.c}</b>.`
      : `${p.c} teček do ${p.a} řádků, v každém <b>${p.ans}</b> ${dotWord(p.ans)}.`}`, 'hint');
    speak(`Správně je ${p.ans}.`);
    state.busy = false;
    nextBtn.hidden = false;
    nextBtn.classList.add('glow');
    nextBtn.focus({ preventScroll: true });
  }

  function advance() {
    state.idx++;
    if (state.idx < state.round.length) showItem();
    else showResult();
  }

  function showResult() {
    const good = state.results.filter(Boolean).length;
    const total = state.round.length;
    const ratio = good / total;
    const earned = ratio >= .9 ? 3 : ratio >= .7 ? 2 : 1;
    const missed = state.round.filter((_, i) => !state.results[i]);
    state.stars += earned;
    persist();
    window.parent.postMessage({
      source: 'skolni-zoo-exercise', type: 'reward', exercise: 'nasobilka',
      event: { kind: 'round', correct: good, total, retry: state.retry },
    }, '*');
    renderDots();
    keypad.parentElement.hidden = true;
    dotsPanel.hidden = true;
    actions.hidden = true;
    const msg = good === total ? 'Bez jediné chyby!' : ratio >= .7 ? 'Moc pěkné!' : 'Dobrý začátek, zkus to znovu.';
    say(msg, ratio >= .7 ? 'ok' : '');
    prompt.innerHTML = `
      <div class="result">
        <div class="big">${good} z ${total}</div>
        <div class="stars">${[0, 1, 2].map(i => STAR.replace('<svg', `<svg class="${i < earned ? 'on' : ''}"`)).join('')}</div>
        ${missed.length ? `<h3>Tady byla chyba</h3><div class="miss">${missed.map(p => `<span>${textOf(p)} = ${p.ans}</span>`).join('')}</div>` : ''}
        <div class="actions">
          ${missed.length ? '<button type="button" class="btn" id="retryBtn">Procvičit chyby</button>' : ''}
          <button type="button" class="btn primary" id="againBtn">Nové kolo</button>
        </div>
      </div>`;
    prompt.querySelectorAll('.stars svg').forEach((s, i) => s.animate(
      [{ transform: 'scale(0) rotate(-90deg)' }, { transform: 'scale(1.3)' }, { transform: 'none' }],
      { duration: T(450), delay: RM ? 0 : 200 + i * 220, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'backwards' },
    ));
    $('#againBtn').addEventListener('click', () => startRound());
    const retry = $('#retryBtn');
    if (retry) retry.addEventListener('click', () => startRound(missed));
    speak(`${good} z ${total}. ${msg}`);
    celebrate();
  }

  function celebrate() {
    if (RM) return;
    const r = bubble.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height;
    for (let i = 0; i < 16; i++) {
      const p = el('div', 'spark', document.body);
      p.innerHTML = STAR;
      p.style.left = cx - 9 + 'px';
      p.style.top = cy - 9 + 'px';
      const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 140;
      p.animate([
        { transform: 'scale(.3)', opacity: 1 },
        { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px) scale(${.7 + Math.random() * .8}) rotate(${Math.random() * 360 - 180}deg)`, opacity: 0 },
      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }).finished.then(() => p.remove());
    }
  }

  // ---------- keypad (the same keys as Sčítání pod sebou) ----------
  [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach(n => {
    const b = el('button', 'key' + (n === 0 ? ' zero' : ''), keypad, n);
    b.type = 'button';
    b.addEventListener('click', () => onDigit(n));
  });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) onDigit(e.key);
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Enter' && !nextBtn.hidden && !state.busy) { e.preventDefault(); advance(); }
  });
  delBtn.addEventListener('click', backspace);
  nextBtn.addEventListener('click', () => { if (!state.busy) advance(); });
  hintBtn.addEventListener('click', () => {
    const p = state.round[state.idx];
    if (!p || state.answered) return;
    hintBtn.disabled = true;
    showDots(p);
    say(p.op === 'x' ? `Spočítej tečky: <span class="a">${p.a}</span> řádků po <span class="b">${p.b}</span>.` : `Rozděl ${p.c} teček do <span class="a">${p.a}</span> řádků.`, 'hint');
  });

  // ---------- settings ----------
  const tablePick = $('#tablePick');
  TABLES.forEach(n => {
    const b = el('button', 'key small', tablePick, String(n));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(state.tables.includes(n)));
    b.addEventListener('click', () => {
      const on = state.tables.includes(n);
      if (on && state.tables.length === 1) return;
      state.tables = on ? state.tables.filter(x => x !== n) : TABLES.filter(x => x === n || state.tables.includes(x));
      b.setAttribute('aria-pressed', String(!on));
      persist();
      startRound();
    });
  });
  function showMode() {
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === state.mode)));
  }
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    state.mode = b.dataset.mode;
    showMode();
    persist();
    startRound();
  }));

  const voiceBtn = $('#voiceBtn');
  voiceBtn.addEventListener('click', () => {
    state.voice = !state.voice;
    voiceBtn.setAttribute('aria-pressed', String(state.voice));
    persist();
    if (!state.voice) stopSpeech();
  });
  voiceBtn.setAttribute('aria-pressed', String(state.voice));
  showMode();
  startRound();
})();
</script>
</body>
</html>
